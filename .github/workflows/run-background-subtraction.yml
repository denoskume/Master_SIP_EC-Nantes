name: Run Background Subtraction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-background-subtraction.yml"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_Works/Image_Processing/Project/Background_Subtraction/requirements.txt
          pip install nbconvert ipykernel

      - name: Clear previous generated outputs
        run: |
          rm -rf Lab_Works/Image_Processing/Project/Background_Subtraction/outputs/figures
          rm -f Lab_Works/Image_Processing/Project/Background_Subtraction/outputs/background_subtraction_metrics.csv
          rm -f Lab_Works/Image_Processing/Project/Background_Subtraction/outputs/background_subtraction_summary.csv

      - name: Execute notebook
        working-directory: Lab_Works/Image_Processing/Project/Background_Subtraction/notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace Background_Subtraction.ipynb \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lab_Works/Image_Processing/Project/Background_Subtraction
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: regenerate Background Subtraction outputs"
            git push
          fi
