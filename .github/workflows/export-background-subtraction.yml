name: Export Background Subtraction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-background-subtraction.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Background Subtraction project
        uses: actions/upload-artifact@v4
        with:
          name: background-subtraction-project
          path: Lab_Works/Image_Processing/Project/Background_Subtraction
          if-no-files-found: error
          retention-days: 1
